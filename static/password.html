<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBlog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background:
                radial-gradient(circle at top left, #334155, transparent 40%),
                radial-gradient(circle at bottom right, #1e293b, transparent 45%),
                #0f172a;

            color: #f8fafc;
        }

        .card {
            width: min(90%, 420px);
            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .title {
            margin: 0 0 10px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #cbd5e1;
            font-size: 15px;
        }

        .input {
            width: 100%;
            padding: 13px 16px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;

            outline: none;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-size: 15px;

            transition: 0.2s;
        }

        .input::placeholder {
            color: #94a3b8;
        }

        .input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        .button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #f8fafc;
            color: #0f172a;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .error {
            min-height: 22px;
            margin-top: 15px;

            color: #fca5a5;
            font-size: 14px;
        }

        .footer {
            margin-top: 28px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1 class="title">MyBlog</h1>

        <p class="subtitle">
            这是一个私人的小角落
        </p>

        <input
            class="input"
            type="password"
            id="password"
            placeholder="请输入访问密码"
            onkeydown="if(event.key === 'Enter') checkPassword()"
        >

        <button class="button" onclick="checkPassword()">
            进入博客
        </button>

        <p class="error" id="error"></p>

        <div class="footer">
            Welcome to my little corner.
        </div>

    </div>

    <script>
        function checkPassword() {

            const password =
                document.getElementById("password").value;

            if (password === "123456") {

                sessionStorage.setItem(
                    "blogUnlocked",
                    "true"
                );

                window.location.href = "./";
            }

            else {

                document.getElementById("error").textContent =
                    "密码错误，请再试一次";
            }
        }
    </script>

</body>
</html>
